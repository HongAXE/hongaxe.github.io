<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面未找到 · HongAX</title>
    <style>
        /* ── 全局重置 & 基础 ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        /* ── 背景装饰 ── */
        .bg-img {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(22, 63, 118, 0.15) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(56, 139, 253, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 100%, rgba(13, 17, 23, 1) 0%, transparent 40%);
            pointer-events: none;
            z-index: 0;
        }

        /* ── 主卡片 ── */
        .error-card {
            position: relative;
            z-index: 1;
            background: rgba(22, 27, 34, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 48px 40px 40px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            transition: border-color 0.3s;
        }

        .error-card:hover {
            border-color: #58a6ff;
        }

        /* ── 错误图标 ── */
        .error-icon {
            font-size: 72px;
            line-height: 1;
            margin-bottom: 16px;
            display: block;
        }

        /* ── 标题 ── */
        .error-title {
            font-size: 28px;
            font-weight: 700;
            color: #f0f6fc;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .error-sub {
            font-size: 16px;
            color: #8b949e;
            margin-bottom: 28px;
            line-height: 1.6;
        }

        /* ── 引导链接按钮组 ── */
        .action-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-top: 4px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 24px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.25s ease;
            border: none;
            cursor: pointer;
            font-family: inherit;
        }

        .btn-primary {
            background: #238636;
            color: #ffffff;
        }

        .btn-primary:hover {
            background: #2ea043;
            transform: scale(1.02);
        }

        .btn-outline {
            background: transparent;
            color: #c9d1d9;
            border: 1px solid #30363d;
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: #58a6ff;
            color: #f0f6fc;
            transform: scale(1.02);
        }

        .btn-secondary {
            background: #21262d;
            color: #c9d1d9;
        }

        .btn-secondary:hover {
            background: #30363d;
            transform: scale(1.02);
        }

        /* ── Warma 档案馆专用按钮（红色调） ── */
        .btn-warma {
            background: #CA494B;
            color: #fff;
            box-shadow: 0 4px 12px rgba(202, 73, 75, 0.3);
        }

        .btn-warma:hover {
            background: #b03e40;
            transform: scale(1.02);
        }

        .btn-warma-outline {
            background: transparent;
            color: #CA494B;
            border: 1px solid rgba(202, 73, 75, 0.4);
        }

        .btn-warma-outline:hover {
            background: rgba(202, 73, 75, 0.1);
            border-color: #CA494B;
            transform: scale(1.02);
        }

        /* ── 科外所专用按钮（紫色调） ── */
        .btn-kgri {
            background: linear-gradient(135deg, #7c3aed, #4f46e5);
            color: #fff;
            box-shadow: 0 4px 16px rgba(124, 58, 237, 0.25);
        }

        .btn-kgri:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 28px rgba(124, 58, 237, 0.4);
        }

        .btn-kgri-outline {
            background: transparent;
            color: #c4b5fd;
            border: 1.5px solid rgba(167, 139, 250, 0.3);
        }

        .btn-kgri-outline:hover {
            background: rgba(167, 139, 250, 0.08);
            border-color: #a78bfa;
            transform: scale(1.02);
        }

        /* ── 底部信息 ── */
        .footer-note {
            position: relative;
            z-index: 1;
            margin-top: 24px;
            font-size: 12px;
            color: #484f58;
            text-align: center;
        }

        .footer-note a {
            color: #58a6ff;
            text-decoration: none;
        }

        .footer-note a:hover {
            text-decoration: underline;
        }

        /* ── 404 模板容器（默认隐藏，JS 控制显示） ── */
        .template-content {
            display: none;
        }

        .template-content.active {
            display: block;
        }

        /* ── 响应式 ── */
        @media (max-width: 420px) {
            .error-card {
                padding: 32px 20px 28px;
            }

            .error-title {
                font-size: 22px;
            }

            .error-icon {
                font-size: 54px;
            }

            .btn {
                padding: 8px 18px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <div class="bg-img"></div>

    <!-- ========================================================= -->
    <!-- 模板 1：通用 404（默认）                                    -->
    <!-- ========================================================= -->
    <div id="template-default" class="template-content active">
        <div class="error-card">
            <span class="error-icon">🔭</span>
            <h1 class="error-title">404 · 未找到</h1>
            <p class="error-sub">
                似乎探索到了一个不存在的页面……<br>
                可能是链接有误，或内容已被移动。
            </p>
            <div class="action-group">
                <a href="/" class="btn btn-primary">🏠 返回首页</a>
                <a href="/work" class="btn btn-outline">📦 查看项目</a>
            </div>
        </div>
        <div class="footer-note">
            <span>© 2026 HongAX · </span>
            <a href="/" target="_blank">个人主页</a>
            <span> · </span>
            <a href="https://github.com/HongAXE" target="_blank">GitHub</a>
        </div>
    </div>

    <!-- ========================================================= -->
    <!-- 模板 2：Warma 档案馆 404                                    -->
    <!-- ========================================================= -->
    <div id="template-warma" class="template-content">
        <div class="error-card" style="border-color:rgba(202,73,75,0.25);">
            <span class="error-icon">🔍</span>
            <h1 class="error-title" style="color:#CA494B;">404 · 未找到</h1>
            <p class="error-sub" style="color:#b0b3b8;">
                啊哦，这个页面好像掉进时空缝隙了……<br>
                可能链接有误或者内容已被吃掉了。
            </p>
            <div class="action-group">
                <a href="/work/1" class="btn btn-warma">🏠 返回档案馆</a>
                <a href="/" class="btn btn-secondary">🌐 个人主页</a>
            </div>
        </div>
        <div class="footer-note">
            <span>© 2026 HongAX · </span>
            <a href="/work/1">Warma档案馆</a>
            <span> · </span>
            <a href="https://github.com/HongAXE" target="_blank">GitHub</a>
        </div>
    </div>

    <!-- ========================================================= -->
    <!-- 模板 3：科外所 404                                          -->
    <!-- ========================================================= -->
    <div id="template-kgri" class="template-content">
        <div class="error-card" style="border-color:rgba(167,139,250,0.2);">
            <span class="error-icon">🛸</span>
            <h1 class="error-title">404 · <span style="background:linear-gradient(135deg,#d8b4fe,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">信号丢失</span></h1>
            <p class="error-sub" style="color:#b0b0c8;">
                这个页面好像掉进时空缝隙了……<br>
                可能是 <span style="color:#c4b5fd;font-weight:500;">坐标偏移</span> 或 <span style="color:#c4b5fd;font-weight:500;">虫洞</span> 暂时关闭了。
            </p>
            <div class="action-group">
                <a href="/work/3" class="btn btn-kgri">🏠 返回科外所</a>
                <a href="/" class="btn btn-secondary">🌐 个人主页</a>
            </div>
        </div>
        <div class="footer-note">
            <span>© 2026 HongAX · </span>
            <a href="/work/3">科外所 KGRI</a>
            <span> · </span>
            <a href="https://github.com/HongAXE" target="_blank">GitHub</a>
        </div>
    </div>

    <!-- ========================================================= -->
    <!-- JavaScript：根据路径切换模板                                 -->
    <!-- ========================================================= -->
    <script>
        (function() {
            var path = window.location.pathname;

            // 获取三个模板容器
            var defaultEl = document.getElementById('template-default');
            var warmaEl = document.getElementById('template-warma');
            var kgriEl = document.getElementById('template-kgri');

            // 先全部隐藏
            defaultEl.classList.remove('active');
            warmaEl.classList.remove('active');
            kgriEl.classList.remove('active');

            // 根据路径判断显示哪个
            if (path.includes('/work/1/')) {
                warmaEl.classList.add('active');
            } else if (path.includes('/work/3/')) {
                kgriEl.classList.add('active');
            } else {
                defaultEl.classList.add('active');
            }
        })();
    </script>

</body>
</html>
