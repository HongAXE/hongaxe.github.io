<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HongAX的个人主页</title>
    <meta name="description" content="HongAX 的个人主页，展示信息、社交链接与作品。">
    <!-- 引入外部 CSS -->
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <header>
        <span class="header-icon">⬡</span>
        <a href="/">HongAX个人主页</a>
    </header>

    <main>
        <div class="page-title">
            <h1>HongAX 的个人主页</h1>
            <p class="sub">そう...</p>
        </div>

        <section class="release-section">
            <h2>关于我</h2>
            <div class="release-list">
                <div class="release-item"><div class="release-left"><span class="tag">头像</span></div><div class="release-right"><img class="avatar-img" src="https://s3.bmp.ovh/2026/06/27/7vP763Jm.png" alt="HongAX 头像" loading="lazy"></div></div>
                <div class="release-item"><div class="release-left"><span class="tag">姓名</span></div><div class="release-right">HongAX</div></div>
                <div class="release-item"><div class="release-left"><span class="tag">生日</span></div><div class="release-right">2009-09-07</div></div>
                <div class="release-item"><div class="release-left"><span class="tag">学校</span></div><div class="release-right">深圳科学高中(全世界最SB的机构)</div></div>
                <div class="release-item"><div class="release-left"><span class="tag">简介</span></div><div class="release-right">作点傻开心的事</div></div>
                <div class="release-item"><div class="release-left"><span class="tag">座右铭</span></div><div class="release-right">自由至上！！！</div></div>
            </div>
        </section>

        <section class="release-section">
            <h2>社交账号</h2>
            <div class="release-list" id="social-list">
                <div class="loading-text">正在加载数据...</div>
            </div>
        </section>

        <section class="release-section">
            <h2 class="work-header">
                <span>项目</span>
                <a href="/work/">查看详细 →</a>
            </h2>
            <div class="release-list" id="works-list">
                <div class="loading-text">正在加载数据...</div>
            </div>
        </section>
    </main>

    <footer>
        <div>© 2026 HongAX 的个人主页</div>
        <div>本网站由 <a href="https://github.com/HongAXE/hongaxe.github.io" target="_blank" rel="noopener noreferrer">GitHub</a> 强力驱动。</div>
    </footer>

    <script>
        // 规范要求的 XSS 转义函数
        function escapeHTML(str) {
            if (!str) return '';
            return String(str).replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag]));
        }

        // 处理文本换行
        function formatText(text) {
            if (!text) return '';
            return escapeHTML(text).replace(/\n/g, '<br>');
        }

        // 渲染社交列表
        function renderSocials(data) {
            const listEl = document.getElementById('social-list');
            if (!data || data.length === 0) {
                listEl.innerHTML = '<div class="loading-text">暂无社交数据</div>';
                return;
            }
            listEl.innerHTML = data.map(item => `
                <a href="${escapeHTML(item.url)}" target="_blank" rel="noopener noreferrer" class="release-item">
                    <div class="release-left"><span class="tag">${escapeHTML(item.platform)}</span></div>
                    <div class="release-right">
                        <div class="social-desc">${formatText(item.desc)}</div>
                    </div>
                    <div class="link-arrow">→</div>
                </a>
            `).join('');
        }

        // 渲染项目列表
        function renderWorks(data) {
            const listEl = document.getElementById('works-list');
            if (!data || data.length === 0) {
                listEl.innerHTML = '<div class="loading-text">暂无项目数据</div>';
                return;
            }
            listEl.innerHTML = data.map(item => {
                let labelClass = 'green';
                if (item.status.includes('停止') || item.status.includes('开发中')) labelClass = 'orange';
        
                const tagsHtml = item.tags.map(t => `<span class="work-tag">${escapeHTML(t)}</span>`).join('');
        
                // 【修改点】：判断是否可点击，且区分内链与外链
                const isLink = item.url && item.url.trim() !== '';
                let linkHref = item.url;
                if (isLink && !item.url.startsWith('http')) {
                    // 主页位于根目录，内部链接需要补全 ./work/ 前缀
                    linkHref = './work/' + item.url;
                }
                const tagName = isLink ? 'a' : 'div';
                const linkAttrs = isLink ? `href="${escapeHTML(linkHref)}" ${item.url.startsWith('http') ? 'target="_blank" rel="noopener noreferrer"' : ''}` : '';
                const arrowHtml = isLink ? `<div class="link-arrow">→</div>` : '';

                return `
                <${tagName} ${linkAttrs} class="release-item">
                    <div class="release-left">
                        <span class="tag">${escapeHTML(item.name)}</span>
                        <div style="color:#8b949e; font-size:12px; margin-top:2px; font-weight:400;">HongAX-Work-${item.id}</div>
                    </div>
                    <div class="release-right">
                        <div>
                            <span class="label ${labelClass}">${escapeHTML(item.status)}</span>
                            ${tagsHtml}
                        </div>
                        <div style="margin-top:6px;">${formatText(item.description)}</div>
                    </div>
                    ${arrowHtml}
                </${tagName}>`;
            }).join('');
        }

        // 异步加载 JSON 数据
        async function loadData() {
            try {
                // 拉取社交数据
                const socialRes = await fetch('./socials.json');
                if (!socialRes.ok) throw new Error('社交数据加载失败');
                const socialData = await socialRes.json();
                renderSocials(socialData);

                // 拉取项目数据
                const worksRes = await fetch('./works.json');
                if (!worksRes.ok) throw new Error('项目数据加载失败');
                const worksData = await worksRes.json();
                renderWorks(worksData);

            } catch (error) {
                console.error(error);
                document.getElementById('social-list').innerHTML = `<div class="loading-text" style="color:#f85149;">数据加载失败，请确认是否在 HTTP 环境下运行。</div>`;
                document.getElementById('works-list').innerHTML = `<div class="loading-text" style="color:#f85149;">数据加载失败，请确认是否在 HTTP 环境下运行。</div>`;
            }
        }

        // 启动
        loadData();
    </script>
</body>
</html>
