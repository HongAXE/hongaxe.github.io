<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跳转中 · 科高樱花社</title>
    
    <style>
        /* 引入本地像素字体（使用绝对路径确保能正确加载） */
        @font-face {
            font-family: 'Zpix';
            src: url('/sakura/static/fonts/Zpix.woff2') format('woff2'),
                 url('/sakura/static/fonts/Zpix.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        /* ── 全局重置 & 羊皮纸变量 ── */
        :root {
            --bg-color: #f6f1e9;
            --text-main: #2b2725;
            --text-sub: #6b6159;
            --sakura-pink: #b04e62;
            --sakura-light: #d67a8b;
            --sakura-dark: #853545;
            --border-color: #d3c9bd;
            --border-dark: #b5a99a;
            --shadow-hard: 3px 3px 0 rgba(0, 0, 0, 0.08);
            --shadow-hard-sm: 2px 2px 0 rgba(0, 0, 0, 0.06);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Zpix', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 20px;
            line-height: 1.6;
            /* 复古网格背景 */
            background-image: 
                linear-gradient(rgba(211, 201, 189, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(211, 201, 189, 0.1) 1px, transparent 1px);
            background-size: 20px 20px;
            background-position: center top;
        }

        /* ── 卡片容器（直角、细边框、硬阴影） ── */
        .redirect-card {
            position: relative;
            z-index: 1;
            background: #fff;
            border: 2px solid var(--border-color);
            border-radius: 0; /* 去除大圆角 */
            padding: 48px 40px 40px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: var(--shadow-hard);
            transition: all 0.2s ease;
        }

        .redirect-card:hover {
            border-color: var(--sakura-pink);
        }

        /* ── 头像 / Logo（复古相框） ── */
        .avatar {
            width: 72px;
            height: 72px;
            border-radius: 0; /* 方形 */
            border: 2px solid var(--border-dark);
            margin: 0 auto 24px;
            display: block;
            object-fit: cover;
            background: var(--bg-color);
            box-shadow: var(--shadow-hard-sm);
        }

        /* ── 标题（像素硬阴影） ── */
        .title {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 8px;
            letter-spacing: 0.05em;
            text-shadow: 1px 1px 0 rgba(0,0,0,0.1);
        }

        .sub {
            font-size: 0.9rem;
            color: var(--text-sub);
            margin-bottom: 32px;
        }

        /* ── 复古加载动画（跳跃的像素方块） ── */
        .loader {
            display: inline-block;
            width: 16px;
            height: 16px;
            background: var(--sakura-pink);
            box-shadow: 2px 2px 0 var(--sakura-dark);
            margin-bottom: 24px;
            animation: pixel-spin 1.2s steps(4) infinite;
        }

        @keyframes pixel-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ── 倒计时文本 ── */
        .countdown {
            font-size: 0.9rem;
            color: var(--text-sub);
            margin-bottom: 24px;
        }

        .countdown strong {
            color: var(--sakura-pink);
            font-weight: 600;
            font-size: 1.1rem;
        }

        /* ── 跳转按钮（物理按键感） ── */
        .btn {
            display: inline-block;
            padding: 10px 28px;
            border-radius: 0;
            font-size: 0.95rem;
            font-weight: 600;
            color: #ffffff;
            background: var(--sakura-pink);
            text-decoration: none;
            border: 2px solid var(--sakura-dark);
            box-shadow: 2px 2px 0 var(--border-dark);
            cursor: pointer;
            transition: all 0.1s;
        }

        .btn:hover {
            background: var(--sakura-light);
        }

        .btn:active {
            transform: translate(2px, 2px);
            box-shadow: none;
        }

        /* ── 底部提示 ── */
        .footer-note {
            position: relative;
            z-index: 1;
            margin-top: 32px;
            font-size: 0.8rem;
            color: var(--text-sub);
        }

        .footer-note a {
            color: var(--sakura-pink);
            text-decoration: none;
            border-bottom: 1px dashed var(--sakura-pink);
            transition: all 0.2s;
        }

        .footer-note a:hover {
            color: var(--sakura-dark);
            border-bottom-style: solid;
        }

        /* ── 响应式 ── */
        @media (max-width: 420px) {
            .redirect-card {
                padding: 32px 20px 28px;
            }
            .title {
                font-size: 1.1rem;
            }
            .avatar {
                width: 56px;
                height: 56px;
            }
        }
    </style>
</head>
<body>

    <!-- 跳转卡片 -->
    <div class="redirect-card">
        <!-- 社徽 -->
        <img class="avatar" src="https://hongaxe.github.io/sakura/static/image/sakura.png" alt="科高樱花社">

        <h1 class="title">正在前往科高樱花社</h1>
        <p class="sub">深圳科学高中 · 正统 ACGN 社团</p>

        <!-- 复古方块加载动画 -->
        <div class="loader"></div>

        <!-- 倒计时显示 -->
        <p class="countdown">
            将在 <strong id="seconds">3</strong> 秒后自动跳转
        </p>

        <!-- 手动跳转按钮 -->
        <a href="https://hongaxe.github.io/sakura/" class="btn">立即跳转 →</a>
    </div>

    <!-- 页脚信息 -->
    <div class="footer-note">
        <span>© 2026 HongAX · </span>
        <a href="/" target="_blank">个人主页</a>
        <span> · </span>
        <a href="https://github.com/HongAXE" target="_blank">GitHub</a>
    </div>

    <!-- 倒计时与跳转脚本 -->
    <script>
        (function() {
            var secondsEl = document.getElementById('seconds');
            var count = 3;
            
            // 1. 倒计时视觉更新
            var timer = setInterval(function() {
                count -= 1;
                if (count <= 0) {
                    clearInterval(timer);
                    secondsEl.textContent = '0';
                } else {
                    secondsEl.textContent = count;
                }
            }, 1000);

            // 2. JS 重定向（比 meta refresh 更平滑，不会打断当前动画）
            setTimeout(function() {
                window.location.href = "https://hongaxe.github.io/sakura/";
            }, 3000);
        })();
    </script>

</body>
</html>
