<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>页面未找到 · Warma档案馆</title>
    <style>
        /* ----- 全局重置 & 设计变量 (与 Warma 档案馆保持一致) ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --vp-c-bg: #ffffff;
            --vp-c-bg-soft: #f9f9f9;
            --vp-c-bg-alt: #f1f1f1;
            --vp-c-text-1: #2c3e50;
            --vp-c-text-2: #566b78;
            --vp-c-text-3: #8a9aa8;
            --vp-c-brand-1: #CA494B;
            --vp-c-brand-soft: rgba(202, 73, 75, 0.14);
            --vp-c-border: #e2e8f0;
            --vp-c-divider: #eaeef2;
            --card-bg: rgba(255, 255, 255, 0.8);
            --card-border: rgba(255, 255, 255, 0.5);
            --shadow-sm: 0 8px 20px rgba(0, 0, 0, 0.03), 0 2px 6px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 12px 28px rgba(0, 0, 0, 0.08);
            --backdrop-blur: blur(12px);
        }

        body.dark {
            --vp-c-bg: #1e1e20;
            --vp-c-bg-soft: #252529;
            --vp-c-bg-alt: #2c2c30;
            --vp-c-text-1: #ececf4;
            --vp-c-text-2: #b0b3b8;
            --vp-c-text-3: #7f8287;
            --vp-c-brand-1: #CA494B;
            --vp-c-brand-soft: rgba(202, 73, 75, 0.2);
            --vp-c-border: #33333a;
            --vp-c-divider: #2a2a2e;
            --card-bg: rgba(30, 30, 32, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --shadow-sm: 0 8px 20px rgba(0, 0, 0, 0.2);
            --shadow-md: 0 12px 28px rgba(0, 0, 0, 0.3);
        }

        body {
            background-color: var(--vp-c-bg);
            color: var(--vp-c-text-1);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            transition: background-color 0.25s ease, color 0.2s ease;
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .container {
            max-width: 540px;
            width: 100%;
            margin: 0 auto;
        }

        /* 毛玻璃卡片 */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: var(--backdrop-blur);
            border-radius: 32px;
            padding: 40px 32px;
            border: 1px solid var(--card-border);
            box-shadow: var(--shadow-md);
            text-align: center;
            transition: transform 0.2s;
        }

        .glass-card:hover {
            transform: translateY(-4px);
        }

        .error-icon {
            font-size: 72px;
            line-height: 1;
            margin-bottom: 12px;
            display: block;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--vp-c-brand-1);
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .sub {
            font-size: 1rem;
            color: var(--vp-c-text-2);
            margin-bottom: 28px;
            line-height: 1.6;
        }

        /* 按钮组 */
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-top: 4px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 24px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            transition: all 0.2s;
            border: none;
            cursor: pointer;
            font-family: inherit;
        }

        .btn-primary {
            background: var(--vp-c-brand-1);
            color: white;
            box-shadow: 0 4px 12px rgba(202, 73, 75, 0.3);
        }
        .btn-primary:hover {
            background: #b03e40;
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(202, 73, 75, 0.4);
        }

        .btn-outline {
            border: 1px solid var(--vp-c-brand-1);
            color: var(--vp-c-brand-1);
            background: transparent;
        }
        .btn-outline:hover {
            background: var(--vp-c-brand-soft);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: var(--vp-c-bg-soft);
            color: var(--vp-c-text-1);
            border: 1px solid var(--vp-c-border);
        }
        .btn-secondary:hover {
            background: var(--vp-c-bg-alt);
            transform: translateY(-2px);
        }

        /* 底部信息 */
        .footer-note {
            margin-top: 24px;
            font-size: 0.8rem;
            color: var(--vp-c-text-3);
            text-align: center;
        }
        .footer-note a {
            color: var(--vp-c-brand-1);
            text-decoration: none;
        }
        .footer-note a:hover {
            text-decoration: underline;
        }

        /* 响应式 */
        @media (max-width: 480px) {
            .glass-card {
                padding: 28px 20px;
            }
            h1 {
                font-size: 1.7rem;
            }
            .error-icon {
                font-size: 54px;
            }
            .btn {
                padding: 8px 18px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body class="dark">
    <div class="container">
        <div class="glass-card">
            <span class="error-icon">🔍</span>
            <h1>404 · 未找到</h1>
            <p class="sub">
                啊哦，页面好像掉进时空缝隙了……<br>
                可能是链接有误或内容已被吃掉了。
            </p>
            <div class="btn-group">
                <a href="/work/1" class="btn btn-primary">🏠 返回档案馆</a>
                <a href="/" class="btn btn-secondary">🌐 个人主页</a>
            </div>
        </div>
        <div class="footer-note">
            <span>© 2026 HongAX · </span>
            <a href="/work/1">Warma档案馆</a>
            <span> · </span>
            <a href="https://github.com/HongAXE" target="_blank">GitHub</a>
        </div>
    </div>

    <!-- 主题检测：与档案馆保持一致，默认深色 -->
    <script>
        (function() {
            // 如果有 localStorage 主题偏好则跟随，否则默认 dark（因为档案馆默认 dark）
            const stored = localStorage.getItem('warma-theme');
            if (stored === 'light') {
                document.body.classList.remove('dark');
            } else if (stored === 'dark') {
                document.body.classList.add('dark');
            } else {
                // 默认深色（与档案馆一致）
                document.body.classList.add('dark');
            }
        })();
    </script>
</body>
</html>
