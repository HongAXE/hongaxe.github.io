<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面未找到 · HongAX</title>
    <style>
        /* ── 全局重置 & 基础 ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        /* ── 背景装饰（同个人主页） ── */
        .bg-img {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(22, 63, 118, 0.15) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(56, 139, 253, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 100%, rgba(13, 17, 23, 1) 0%, transparent 40%);
            pointer-events: none;
            z-index: 0;
        }

        /* ── 主卡片 ── */
        .error-card {
            position: relative;
            z-index: 1;
            background: rgba(22, 27, 34, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 48px 40px 40px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            transition: border-color 0.3s;
        }

        .error-card:hover {
            border-color: #58a6ff;
        }

        /* ── 错误图标 ── */
        .error-icon {
            font-size: 72px;
            line-height: 1;
            margin-bottom: 16px;
            display: block;
        }

        /* ── 标题 ── */
        .error-title {
            font-size: 28px;
            font-weight: 700;
            color: #f0f6fc;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .error-sub {
            font-size: 16px;
            color: #8b949e;
            margin-bottom: 28px;
            line-height: 1.6;
        }

        /* ── 引导链接按钮组 ── */
        .action-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-top: 4px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 24px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.25s ease;
            border: none;
            cursor: pointer;
            font-family: inherit;
        }

        .btn-primary {
            background: #238636;
            color: #ffffff;
        }

        .btn-primary:hover {
            background: #2ea043;
            transform: scale(1.02);
        }

        .btn-outline {
            background: transparent;
            color: #c9d1d9;
            border: 1px solid #30363d;
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: #58a6ff;
            color: #f0f6fc;
            transform: scale(1.02);
        }

        .btn-secondary {
            background: #21262d;
            color: #c9d1d9;
        }

        .btn-secondary:hover {
            background: #30363d;
            transform: scale(1.02);
        }

        /* ── 底部信息 ── */
        .footer-note {
            position: relative;
            z-index: 1;
            margin-top: 24px;
            font-size: 12px;
            color: #484f58;
            text-align: center;
        }

        .footer-note a {
            color: #58a6ff;
            text-decoration: none;
        }

        .footer-note a:hover {
            text-decoration: underline;
        }

        /* ── 响应式 ── */
        @media (max-width: 420px) {
            .error-card {
                padding: 32px 20px 28px;
            }

            .error-title {
                font-size: 22px;
            }

            .error-icon {
                font-size: 54px;
            }

            .btn {
                padding: 8px 18px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <div class="bg-img"></div>

    <div class="error-card">
        <span class="error-icon">🔭</span>
        <h1 class="error-title">404 · 未找到</h1>
        <p class="error-sub">
            似乎探索到了一个不存在的页面……<br>
            可能是链接有误/内容已被移动。
        </p>

        <div class="action-group">
            <a href="/" class="btn btn-primary">🏠 返回首页</a>
            <a href="/work" class="btn btn-outline">📦 查看项目</a>
        </div>
    </div>

    <div class="footer-note">
        <span>© 2026 HongAX · </span>
        <a href="/" target="_blank">个人主页</a>
        <span> · </span>
        <a href="https://github.com/HongAXE" target="_blank">GitHub</a>
    </div>

</body>
</html>
