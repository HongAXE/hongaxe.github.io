<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 · 科外所</title>
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #0b0b10;
            color: #e4e4ee;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow-x: hidden;
        }

        /* ===== 星空背景（与科外所主页一致） ===== */
        .bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
            background:
                radial-gradient(ellipse at 25% 20%, rgba(100, 70, 200, 0.20) 0%, transparent 65%),
                radial-gradient(ellipse at 75% 80%, rgba(180, 60, 140, 0.12) 0%, transparent 55%),
                radial-gradient(ellipse at 50% 50%, #0b0b10 0%, transparent 80%);
        }

        .bg-canvas::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(1.5px 1.5px at 12% 25%, rgba(255, 255, 255, 0.35), transparent),
                radial-gradient(1.5px 1.5px at 28% 65%, rgba(255, 255, 255, 0.25), transparent),
                radial-gradient(1.5px 1.5px at 48% 12%, rgba(255, 255, 255, 0.40), transparent),
                radial-gradient(1.5px 1.5px at 72% 78%, rgba(255, 255, 255, 0.25), transparent),
                radial-gradient(1.5px 1.5px at 88% 42%, rgba(255, 255, 255, 0.35), transparent),
                radial-gradient(1px 1px at 18% 88%, rgba(255, 255, 255, 0.45), transparent),
                radial-gradient(1px 1px at 42% 48%, rgba(255, 255, 255, 0.30), transparent),
                radial-gradient(1px 1px at 68% 22%, rgba(255, 255, 255, 0.25), transparent),
                radial-gradient(1px 1px at 55% 92%, rgba(255, 255, 255, 0.25), transparent),
                radial-gradient(1px 1px at 8% 52%, rgba(255, 255, 255, 0.35), transparent);
            background-size: 100% 100%;
            animation: twinkle 10s ease-in-out infinite alternate;
        }

        @keyframes twinkle {
            0%,
            100% {
                opacity: 0.55;
            }
            50% {
                opacity: 1;
            }
        }

        /* ===== 卡片容器 ===== */
        .container {
            position: relative;
            z-index: 1;
            max-width: 500px;
            width: 100%;
        }

        .card {
            background: rgba(255, 255, 255, 0.025);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 44px 32px 36px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            transition: border-color 0.3s, transform 0.3s;
        }

        .card:hover {
            border-color: rgba(167, 139, 250, 0.20);
            transform: translateY(-3px);
        }

        /* ===== 内容 ===== */
        .icon {
            font-size: 72px;
            line-height: 1;
            margin-bottom: 12px;
            display: block;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            color: #ececf5;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        h1 .accent {
            background: linear-gradient(135deg, #d8b4fe, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .sub {
            font-size: 1rem;
            color: #b0b0c8;
            line-height: 1.7;
            margin-bottom: 28px;
        }

        .sub .hl {
            color: #c4b5fd;
            font-weight: 500;
        }

        /* ===== 按钮组 ===== */
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 24px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.25s ease;
            border: none;
            cursor: pointer;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(135deg, #7c3aed, #4f46e5);
            color: #fff;
            box-shadow: 0 4px 16px rgba(124, 58, 237, 0.25);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(124, 58, 237, 0.40);
        }

        .btn-outline {
            background: transparent;
            color: #c4b5fd;
            border: 1.5px solid rgba(167, 139, 250, 0.20);
        }

        .btn-outline:hover {
            background: rgba(167, 139, 250, 0.06);
            border-color: #a78bfa;
            transform: translateY(-2px);
        }

        .btn-ghost {
            background: rgba(255, 255, 255, 0.04);
            color: #b0b0c8;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .btn-ghost:hover {
            background: rgba(255, 255, 255, 0.07);
            transform: translateY(-2px);
        }

        /* ===== 底部 ===== */
        .footer-note {
            position: relative;
            z-index: 1;
            margin-top: 24px;
            font-size: 12px;
            color: #5a5a78;
            text-align: center;
        }

        .footer-note a {
            color: #8a8aa8;
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer-note a:hover {
            color: #c4b5fd;
        }

        .footer-note .sep {
            color: #3a3a58;
            margin: 0 4px;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 480px) {
            .card {
                padding: 32px 18px 28px;
            }

            .icon {
                font-size: 54px;
            }

            h1 {
                font-size: 1.7rem;
            }

            .sub {
                font-size: 0.92rem;
            }

            .btn {
                padding: 8px 18px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <!-- 星空背景 -->
    <div class="bg-canvas"></div>

    <!-- 主卡片 -->
    <div class="container">
        <div class="card">
            <span class="icon">🛸</span>
            <h1>404 · <span class="accent">信号丢失</span></h1>
            <p class="sub">
                页面好像掉进时空缝隙了……<br />
                可能是 <span class="hl">坐标偏移</span> 或 <span class="hl">虫洞</span> 暂时关闭了。
            </p>
            <div class="btn-group">
                <a href="/work/3" class="btn btn-primary">🏠 返回科外所</a>
                <a href="/" class="btn btn-ghost">🌐 个人主页</a>
            </div>
        </div>
        <div class="footer-note">
            <span>© 2026 HongAX · </span>
            <a href="/work/3">科外所 KGRI</a>
            <span> · </span>
            <a href="https://github.com/HongAXE" target="_blank">GitHub</a>
        </div>
    </div>

</body>
</html>
