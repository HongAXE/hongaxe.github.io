<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目清单 - HongAX个人主页</title>
    <!-- 复用根目录的样式表 -->
    <link rel="stylesheet" href="../style.css">
    <style>
        /* 针对详情页的微调补充 */
        .work-detail-list .release-item {
            flex-direction: column;
            gap: 12px;
            padding: 24px;
        }
        .work-detail-list .release-left {
            flex: unset;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            border-bottom: 1px dashed #30363d;
            padding-bottom: 12px;
            margin-bottom: 4px;
        }
        .work-detail-list .release-left .tag {
            font-size: 18px;
        }
        .work-detail-list .release-right {
            padding-right: 0;
            font-size: 15px;
        }
        .work-detail-list .release-item:hover {
            box-shadow: inset 4px 0 0 #58a6ff;
        }
    </style>
</head>
<body>

    <header>
        <span class="header-icon">⬡</span>
        <a href="../">HongAX个人主页</a>
    </header>

    <main>
        <div class="page-title">
            <h1>项目档案馆</h1>
            <p class="sub">HongAX 的项目与实验档案</p>
        </div>

        <section class="release-section">
            <h2 class="work-header">
                <span>所有项目</span>
                <a href="../">← 返回首页</a>
            </h2>

            <!-- 动态渲染区域 -->
            <div class="release-list work-detail-list" id="works-list">
                <div class="loading-text">正在加载项目档案...</div>
            </div>
        </section>
    </main>

    <footer>
        <div>© 2026 HongAX 的个人主页</div>
        <div>本网站由 <a href="https://github.com/HongAXE/hongaxe.github.io" target="_blank" rel="noopener noreferrer">GitHub Pages</a> 强力驱动。</div>
    </footer>

    <script>
        function escapeHTML(str) {
            if (!str) return '';
            return String(str).replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag]));
        }

        function formatText(text) {
            if (!text) return '';
            return escapeHTML(text).replace(/\n/g, '<br>');
        }

        function renderWorks(data) {
            const listEl = document.getElementById('works-list');
            if (!data || data.length === 0) {
                listEl.innerHTML = '<div class="loading-text">暂无项目数据</div>';
                return;
            }

            // 按 ID 排序
            data.sort((a, b) => a.id - b.id);

            listEl.innerHTML = data.map(item => {
                let labelClass = 'green';
                if (item.status.includes('停止') || item.status.includes('开发中')) labelClass = 'orange';
                
                const tagsHtml = item.tags.map(t => `<span class="work-tag">${escapeHTML(t)}</span>`).join('');
                
                // 渲染底部操作区（主链接 + 额外附加链接）
                let linksHtml = '';
                if (item.url && item.url.trim() !== '') {
                    const isExternal = item.url.startsWith('http');
                    let linkHref = item.url;
                    
                    // 【修改点】：内部链接补全当前目录 ./ 前缀
                    if (!isExternal) {
                        linkHref = './' + item.url;
                    }
                    
                    linksHtml += `<a href="${escapeHTML(linkHref)}" ${isExternal ? 'target="_blank" rel="noopener noreferrer"' : ''} style="color:#58a6ff; text-decoration:none; margin-right: 16px;">查看详情 →</a>`;
                }

                if (item.id === 0) {
                    linksHtml += `<a href="../" style="color:#58a6ff; text-decoration:none; margin-right: 16px;">访问网站 →</a>`;
                } else if (item.id === 6) {
                    linksHtml += `<a href="https://github.com/arcxingye/EatKano" target="_blank" rel="noopener noreferrer" style="color:#8b949e; text-decoration:none; margin-right: 16px;">原项目仓库 →</a>`;
                    linksHtml += `<a href="https://www.taptap.cn/app/919451" target="_blank" rel="noopener noreferrer" style="color:#8b949e; text-decoration:none;">TapTap 页面 →</a>`;
                }

                return `
                <div class="release-item">
                    <div class="release-left">
                        <span class="tag">${escapeHTML(item.name)}</span>
                        <div style="color:#8b949e; font-size:12px; font-weight:400;">HongAX-Work-${item.id}</div>
                    </div>
                    <div class="release-right">
                        <div style="margin-bottom: 10px;">
                            <span class="label ${labelClass}">${escapeHTML(item.status)}</span>
                            ${tagsHtml}
                        </div>
                        <div style="color: #c9d1d9; line-height: 1.7; margin-bottom: 16px;">
                            ${formatText(item.description)}
                        </div>
                        <div style="font-size:14px; display:flex; flex-wrap:wrap; gap:8px 16px;">
                            ${linksHtml}
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        async function loadData() {
            try {
                const res = await fetch('../works.json');
                if (!res.ok) throw new Error('网络请求失败');
                const worksData = await res.json();
                renderWorks(worksData);
            } catch (error) {
                console.error(error);
                document.getElementById('works-list').innerHTML = `<div class="loading-text" style="color:#f85149;">数据加载失败，请确保在 HTTP 环境下运行并存在 ../works.json 文件。</div>`;
            }
        }

        loadData();
    </script>
</body>
</html>
